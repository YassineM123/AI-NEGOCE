name: agentic-specialists-and-director
on: [push, pull_request]

jobs:
  agentic-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run server/agents/revenue-growth.test.ts server/agents/revenue-growth.api.test.ts server/agents/agentic-suite.test.ts server/agents/agentic-suite.api.test.ts server/agents/workspace.api.test.ts server/agents/five-agents-journey.api.test.ts
      - name: Final five-scenario deterministic demonstration recipe
        run: npx vitest run server/agents/final-demo-recipe.api.test.ts server/agents/explainable-scenarios.api.test.ts server/agents/revenue-12000-customers.test.ts --reporter=verbose
      - run: npm run agentic:typecheck
      - run: npm run agentic:build

  agentic-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: agentic_qa_only
          POSTGRES_USER: postgres
          POSTGRES_DB: agentic_qa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d agentic_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:agentic_qa_only@127.0.0.1:5432/agentic_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vitest run server/agents/workspace.pg.test.ts server/analytics-database.pg.test.ts server/agents/final-demo-recipe.pg.test.ts
