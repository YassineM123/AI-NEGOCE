name: agentic-command-center
on: [push, pull_request]

jobs:
  react-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run agentic:typecheck
      - run: npm run agentic:build
      - name: Verify all three platforms bundled
        run: |
          test -f dist-agentic/index.html
          test -f dist-agentic/platform/bi/index.html
          test -f dist-agentic/platform/ds/index.html
          test -d dist-agentic/data/extractions
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config dashboards/agentic-ai/playwright.config.ts
