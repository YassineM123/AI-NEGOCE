.exec-panel{margin-top:0!important;min-width:0;padding:16px 16px 14px}
.exec-panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:26px;margin-bottom:10px}
.exec-panel-head h2{display:flex;align-items:center;gap:8px;font-size:12.4px;color:#142746;letter-spacing:-.18px;font-weight:780;line-height:1.3}
.exec-panel-head h2 .ico{color:#115cec}
.panel-menu{display:grid;place-items:center;width:27px;height:27px;min-width:27px;border:0;background:none;border-radius:6px;color:#7284a0}
.panel-menu:hover{background:#ecf4ff;color:#0856d3}
.exec-chart{min-height:190px}
.exec-chart .spark{height:190px;width:100%;max-height:none}
.exec-chart .line-legend{margin-top:-5px;gap:8px;font-size:9px}
.exec-chart-caption{margin-top:9px;color:#8391a9;font-size:9px;line-height:1.4}
.sector-bars{height:210px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;padding:4px 3px 0;align-items:end;border-bottom:1px solid #e9eff7}
.sector-col{height:100%;min-width:0;display:flex;align-items:center;flex-direction:column;justify-content:flex-end;gap:4px}
.sector-number{font-size:10px;font-weight:750;color:#617998;white-space:nowrap}
.sector-track{height:170px;display:flex;align-items:flex-end;justify-content:center;width:100%;border-bottom:1px solid #dee8f5;background:repeating-linear-gradient(to top,transparent 0,transparent 31px,#eaf0f7 32px,#eaf0f7 33px)}
.sector-fill{width:65%;max-width:34px;min-height:3px;background:var(--bar-color);border-radius:5px 5px 0 0;transition:height .3s}
.sector-col>span{min-width:0;text-align:center;max-width:100%;height:27px;line-height:1.15;font-size:9px;color:#647895;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.donut-layout{display:flex;align-items:center;justify-content:center;gap:4px;min-height:218px}
.donut{width:min(57%,195px);flex-shrink:1;overflow:visible}
.donut-number{fill:#0f264a;font-size:27px;font-weight:780}
.donut-sub{fill:#92a0b4;font-size:12px}
.donut-legend{flex:1;min-width:0;display:grid;gap:14px}
.legend-row{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:10px}
.legend-row strong{white-space:nowrap;color:#284064;font-size:10px}
.legend-name{display:flex;align-items:center;gap:6px;color:#5b7291;white-space:nowrap}
.legend-name i{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}
.exec-workspace{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,.92fr);gap:12px;margin-top:12px;align-items:stretch}
.pipeline-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pipeline-column{border:1px solid #e4eaf4;background:#f7f9fd;border-radius:10px;padding:9px 8px;min-width:0;display:flex;flex-direction:column;min-height:197px}
.pipeline-column-head{min-height:42px}
.pipeline-column-head>div{display:flex;gap:6px;align-items:center}
.status-dot{height:8px;width:8px;border-radius:50%;flex-shrink:0}
.pipeline-column-head strong{font-size:9.5px;line-height:1.2;color:#273d60;white-space:nowrap}
.pipeline-column-head small{display:block;color:#8293ac;font-size:9px;margin:4px 0 8px 14px}
.pipeline-items{display:grid;gap:6px;flex:1;align-content:start}
.deal-card{width:100%;display:grid;gap:3px;text-align:left;min-width:0;border:1px solid #e4ebf5;background:white;border-radius:8px;padding:8px 7px;box-shadow:0 2px 5px #31537e08;font-size:10px;color:#253d62}
.deal-card strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:9.4px}
.deal-card small{font-size:9px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#6b7e9b}
.deal-foot{font-size:9px;color:#0b60e7;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deal-action:hover{border-color:#b6d2ff;background:#f9fbff}
.pipeline-empty{font-size:9px;color:#9aabc2;text-align:center;border:1px dashed #dce6f3;border-radius:7px;padding:17px 3px}
.pipeline-more{display:flex;justify-content:center;align-items:center;gap:3px;border:1px solid #e3eaf4;background:white;border-radius:7px;color:#4d75b3;font-size:8.5px;font-weight:730;min-height:26px;padding:4px 2px;margin-top:7px;white-space:normal}
.pipeline-more:hover{background:#ecf4ff}
.recommendation-list{display:grid;gap:8px}
.recommendation{display:flex;align-items:center;gap:11px;background:#fafcff;border:1px solid #e6edf7;border-radius:11px;padding:10px;min-height:58px}
.rec-icon{width:35px;height:35px;display:grid;place-items:center;border-radius:9px;flex-shrink:0}
.rec-icon.blue{background:#eaf2ff;color:#0758ed}
.rec-icon.green{background:#eaf8ef;color:#14a36f}
.rec-icon.amber{background:#fff6e6;color:#c38b27}
.recommendation>span:nth-child(2){flex:1;min-width:0;display:grid;gap:4px}
.recommendation strong{font-size:10.1px;color:#233958;line-height:1.25}
.recommendation small{color:#8292a8;font-size:9.2px;line-height:1.35}
.recommendation>button{display:grid;place-items:center;background:none;border:0;color:#4a6fa5;padding:3px}
.recommendation-foot{margin-top:11px;color:#8798ad;display:flex;align-items:center;gap:5px;font-size:9px;line-height:1.5}
.exec-bottom{display:grid;grid-template-columns:minmax(0,1.16fr) minmax(0,1fr);gap:12px;margin-top:12px;align-items:stretch}
.text-link{border:0;background:transparent;color:#0758ed;font-size:10px;font-weight:780;white-space:nowrap;display:flex;gap:3px;align-items:center}
.exec-priority .table-wrap{border:0;border-radius:8px;overflow:auto}
.exec-priority .table{min-width:540px}
.exec-priority .table th{font-size:9px;color:#647895;background:#f1f5fa;padding:9px 10px}
.exec-priority .table td{font-size:10px;padding:9px 10px}
.client-cell{display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:10px;font-weight:760;color:#263b5d;border:0;background:none;padding:0;text-align:left}
.client-cell .ico{color:#4276b9}
.client-cell:hover{color:#0758ed}
.mini-tag{display:inline-block;border-radius:30px;background:#eaf1ff;color:#2264d9;font-size:9px;padding:5px 8px;font-weight:710}
.exec-table-foot{font-size:9px;color:#8a99ae;margin-top:11px;line-height:1.5}
.team-stats{min-height:194px}
.team-head,.team-row{display:grid;grid-template-columns:minmax(110px,.9fr) minmax(90px,1.3fr) 36px;align-items:center;gap:9px;padding:7px 0}
.team-head{font-size:9px;color:#8695ab;border-bottom:1px solid #e8eef7}
.team-row{border-bottom:1px solid #edf2f7;min-height:38px}
.team-row:last-child{border:0}
.team-person{display:flex;align-items:center;gap:6px;min-width:0;font-size:9.5px;color:#2c4365;font-weight:600}
.team-person>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-avatar{height:25px;width:25px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800}
.team-track{height:10px;border-radius:20px;background:#e6edf7;overflow:hidden;position:relative}
.team-track>span{height:100%;display:block;border-radius:20px;min-width:0}
.team-row strong{font-size:10px;color:#1f436d;text-align:right}
.empty-state-with-action{min-height:195px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;text-align:center;color:#91a3b9;padding:20px}
.empty-state-with-action b{color:#5f718c;font-size:11px}
.empty-state-with-action p{max-width:260px;font-size:10px}
.footer{font-size:9px;color:#8fa0b8}
@media(min-width:1680px){.sidebar{width:240px}.main{max-width:1760px;margin:auto}.exec-panel{padding:20px}.executive-kpis{gap:13px}.pipeline-grid{gap:10px}}

@media(max-width:750px){.app-shell{display:block}.sidebar{position:relative;width:100%;height:auto;min-height:0;padding:12px 13px 10px}.sidebar::before,.sidebar-divider,.sidebar-footer,.nav-group{display:none}.brand{margin:0 0 9px}.nav-scroll{max-height:none;display:flex;overflow-x:auto;gap:7px;padding:2px 0 5px;scrollbar-width:thin}.nav{display:flex;flex-shrink:0;gap:3px}.nav button{min-width:max-content;padding:9px 12px;font-size:10px}.nav .symbol{display:flex;width:16px}.nav .symbol svg{height:15px;width:15px}.workspace{width:100%}.topbar{height:56px;padding:0 13px}.global-search{max-width:none;height:34px}.global-search input{font-size:11px}.icon-button{min-width:30px;min-height:32px}.top-avatar{height:30px;width:30px}.main{width:100%;padding:0 12px 28px}.page-toolbar{align-items:flex-start;flex-wrap:wrap;padding:9px 0 2px}.page-toolbar-actions{justify-content:flex-start}.executive-title{align-items:flex-start;flex-wrap:wrap;margin-top:13px}.executive-title h1{font-size:21px}.executive-right{margin-left:auto}.executive-kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.exec-kpi{min-height:118px}.exec-analytics{grid-template-columns:1fr}.chart-segment{grid-column:auto}.exec-analytics,.exec-workspace,.exec-bottom{gap:9px}.pipeline-grid{display:flex;overflow-x:auto;padding-bottom:3px}.pipeline-column{min-width:154px;max-width:180px}.exec-chart .spark{height:190px}.sector-bars{height:198px}.donut-layout{max-width:none}.donut{width:47%}.exec-date{min-height:32px}.data-trust-banner{align-items:flex-start}.data-trust-banner button{padding-top:2px}.exec-panel-head h2{font-size:12px}}

/* ========================================================================
   AI-NÉGOCE / Unified Executive Design System v4
   EXACT SAME 16 BUSINESS MODULES — no synthetic UI figures or new sections.
   Palette and component density are consistent across each navigation page.
   ======================================================================== */
:root{
  --blue:#075af1;--deep:#061b3c;--ink:#0f1f3b;--muted:#71809c;
  --line:#e4ebf6;--bg:#f4f7fc;--shadow:0 3px 13px rgba(23,53,103,.055),0 1px 3px rgba(23,53,103,.045)
}
html{scroll-behavior:smooth}
body{font-size:13px;letter-spacing:-.04px}
.workspace{overflow:hidden}
#content{min-width:0}
.module-page{padding-top:3px;padding-bottom:18px}
.module-header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:10px 0 18px}
.module-title-row{display:flex;gap:14px;align-items:center;min-width:0}
.module-title-icon{width:51px;height:51px;display:grid;place-items:center;border:1px solid #dce8ff;background:linear-gradient(160deg,#e7f1ff,#f7faff);border-radius:14px;color:#0b5def;flex-shrink:0}
.module-title-copy{min-width:0}
.module-kicker{color:#8a9ab2;font-size:10px;text-transform:uppercase;letter-spacing:1.02px;font-weight:760;display:block;margin-bottom:6px}
.module-kicker span{color:#aec0d8;margin:0 6px}
.module-header h1{font-size:23px;font-weight:790;line-height:1.2;letter-spacing:-.8px;color:#111f39}
.module-header p{font-size:12px;color:#74849c;margin-top:5px;line-height:1.45}
.module-header-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.module-header-right .badge{font-size:10px;padding:6px 10px}
.module-header-right .sources-link{min-height:36px;background:#fff;font-size:11px;gap:7px}
.module-header-right .sources-link:hover{border-color:#87b2ff;background:#f8fbff;color:#0957d8}
.module-page>.grid.cards{margin:15px 0 14px}
.module-page .grid.cards{gap:12px}
.module-page .grid.cards.kpi-five{grid-template-columns:repeat(5,minmax(0,1fr))}
.module-page .card.metric-tile{position:relative;display:flex;flex-direction:column;min-width:0;min-height:153px;padding:15px 15px 14px;border-radius:13px;border:1px solid #e3ebf7;background:#fff;box-shadow:var(--shadow)}
.metric-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px}
.metric-symbol{display:grid;place-items:center;height:37px;width:37px;border-radius:11px;color:#0a5df4;background:#ecf3ff}
.metric-symbol.green{background:#e9f8f0;color:#15966a}
.metric-symbol.red{background:#fff1f1;color:#ce5260}
.metric-more{font-weight:800;color:#8294b1;letter-spacing:2px;font-size:16px;line-height:12px}
.metric-tile .metric-label{font-weight:680;font-size:11px;color:#516783;line-height:1.35}
.metric-tile .metric-value{font-size:clamp(16px,1.35vw,24px);letter-spacing:-.7px;font-weight:790;line-height:1.18;color:#102340;margin:7px 0;overflow-wrap:anywhere}
.metric-tile .metric-note{font-size:10px;color:#7f8da4;margin-top:auto;line-height:1.45;min-height:14px}
.module-page .panel{border:1px solid #e4ecf7;border-radius:14px;box-shadow:var(--shadow);background:#fff;margin-top:14px;padding:18px}
.module-page .grid.two>.panel{margin-top:0}
.module-page .panel-head{margin-bottom:15px;align-items:center}
.module-page .panel-title-group{display:flex;align-items:center;gap:10px;min-width:0}
.module-page .panel-title-icon{height:31px;width:31px;display:grid;place-items:center;flex-shrink:0;border-radius:9px;background:#ebf2ff;color:#0860ef}
.module-page .panel-head h2{font-size:14px;line-height:1.35;font-weight:760;color:#182945;letter-spacing:-.26px}
.module-page .panel-head p{font-size:10.5px;color:#8796ad;line-height:1.45;margin-top:3px}
.module-page .panel-actions{display:flex;align-items:center;gap:8px}
.module-page .panel-actions .btn{font-size:10.5px}
.module-page .notice{margin:13px 0;background:#fffaf1;border:1px solid #f3dfc0;color:#8a692e;display:flex;justify-content:flex-start;align-items:center;gap:10px;border-radius:11px;padding:12px 14px;font-size:11px;line-height:1.55}
.module-page .notice.secondary{background:#edf5ff;border-color:#d6e7ff;color:#3a6498}
.module-page .notice-icon{display:grid;place-items:center;flex-shrink:0;width:27px;height:27px;border-radius:8px;background:#fff0d8;color:#b47a16}
.module-page .notice.secondary .notice-icon{background:#e0ecff;color:#135bde}
.module-page .filterbar{background:#fff;border:1px solid #e4ebf5;border-radius:12px;padding:12px 14px;margin:14px 0;box-shadow:0 2px 7px #17447808}
.module-page .filterbar label{font-weight:620;color:#657895;font-size:11px}
.module-page .select,.module-page .input{font-size:11.5px;border:1px solid #dce5f2;border-radius:9px;background:#fafcff;padding:9px 11px;min-height:36px}
.module-page .btn{padding:8px 12px;font-size:11px;border-radius:9px}
.module-page .btn.tiny{font-size:10px;padding:6px 9px;min-height:29px}
.module-page .table-wrap{border:1px solid #e6edf7;border-radius:10px;overflow:auto;max-width:100%}
.module-page .table{background:#fff;border-collapse:separate;border-spacing:0}
.module-page .table th{background:#f4f7fb;color:#61748f;font-weight:710;font-size:10px;white-space:nowrap;padding:12px 13px;border-bottom:1px solid #e6eef9}
.module-page .table td{padding:11px 13px;line-height:1.36;font-size:11px;color:#30435e;border-bottom:1px solid #eef2f8}
.module-page .table tbody tr:hover{background:#f4f8ff}
.module-page .table button.link{color:#0859e4;font-weight:730}
.module-page .barlist{gap:13px}
.module-page .barrow{font-size:11px;grid-template-columns:minmax(95px,165px) 1fr 90px}
.module-page .barrow b{font-size:11px;color:#2e476b;text-align:right}
.module-page .track{height:9px;background:#edf2fb}
.module-page .track i{background:linear-gradient(90deg,#78b5ff,#0c60eb)}
.module-page .chart-foot{font-size:10.5px;color:#8494aa}
.module-page .callout{border-radius:11px;background:#f3f7ff;border-color:#e0eafd;color:#426184;font-size:11.5px}
.module-page .decision{background:#fbfcff;border-color:#e8eff8;border-radius:11px}
.module-page .details{font-size:11.5px}
.module-page .frow{font-size:11.5px;gap:16px}
.module-page .section-head{margin:10px 0 14px}
.module-page .section-head h2{font-size:20px}
/* Client portfolio */
.client-overview-grid{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.3fr);gap:12px;margin-top:2px}
.client-overview-grid>.panel{margin:0}
.client-overview-grid .donut-layout{padding:6px 2px 4px}
.client-overview-grid .donut{width:min(100%,175px)}
.client-overview-grid .exec-chart{width:100%}
.client-trend-panel .spark-wrap{min-height:190px}
.client-trend-panel .spark{height:185px}
.client-database{margin-top:13px!important}
.client-database .filterbar{box-shadow:none;margin:0 0 14px}
.field-search{height:40px;display:flex!important;align-items:center;gap:10px;flex:1;min-width:245px;border:1px solid #dce6f4;border-radius:9px;padding:0 12px;background:#f9fbff;color:#6682aa}
.field-search .input{width:100%;height:100%;border:0;background:transparent;padding:4px;outline:none;min-width:80px}
.filter-hint{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:10.5px;color:#8899b0}
.client-database .table th,.client-database .table td{font-size:10.5px}
.segment-pill{display:inline-block;background:#eaf2ff;color:#2161ba;border-radius:30px;padding:5px 9px;font-weight:720;font-size:10px;white-space:nowrap}
.segment-pill.growth{background:#e5f9ed;color:#158751}
.segment-pill.risk{background:#fff0df;color:#a16a18}
.client-database .page-hint{margin:12px 0 0}
/* Tasks & teams */
.task-layout{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(255px,.65fr);gap:12px;align-items:stretch}
.task-layout>.panel{margin-top:0}
.task-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.task-column{border:1px solid #e5edf8;border-radius:10px;background:#f7f9fd;min-width:0;min-height:230px;padding:9px;display:flex;flex-direction:column}
.task-col-head{display:flex;justify-content:space-between;align-items:center;gap:5px;min-height:30px;font-size:11px;font-weight:730;color:#2d4361}
.task-col-head span{display:flex;align-items:center;gap:7px}
.task-col-head i{display:inline-block;flex-shrink:0;width:8px;height:8px;border-radius:50%}
.task-col-head em{font-size:10px;font-style:normal;background:white;border:1px solid #dce8f8;border-radius:7px;padding:3px 7px}
.task-col-items{margin-top:9px;display:grid;align-content:start;gap:7px;flex:1}
.task-card{border:1px solid #e4ebf5;background:white;border-radius:9px;padding:11px 10px;display:grid;gap:7px;box-shadow:0 1px 4px #2842720a}
.task-card strong{font-size:10.5px;color:#213958;line-height:1.4}
.task-card small{font-size:10px;color:#6380a0}
.task-card-meta{display:flex;gap:6px;justify-content:space-between;flex-wrap:wrap;font-size:9px;color:#6e819c}
.task-card-meta span{display:flex;align-items:center;gap:3px;white-space:nowrap}
.task-card .btn{width:100%}
.task-no-data{font-size:10px;color:#97a6bb;text-align:center;border:1px dashed #d8e3f0;border-radius:9px;padding:22px 7px}
.task-priority .priority-item{display:flex;align-items:center;gap:9px;border:1px solid #e8eff9;border-radius:10px;padding:10px;margin-bottom:8px;background:#fcfdff}
.priority-indicator{display:grid;place-items:center;width:32px;height:32px;flex-shrink:0;border-radius:9px;background:#eaf2ff;color:#0b5aec}

 <div class="data-trust-banner ${goodDemo?'demo-banner':''}"><span>${ico(goodDemo?'shield':'warning',17)}</span><p>${qa}</p><button data-nav="quality" title="Contrôles de qualité">Contrôler ${ico('arrow',15)}</button></div>
 <div class="executive-kpis">${kpis.map(k=>`<div class="exec-kpi"><div class="kpi-top"><span class="kpi-icon ${k.accent}">${ico(k.icon,20)}</span><span class="kpi-overflow">···</span></div><div class="kpi-info"><span>${k.label}</span><b>${k.value}</b><small>${html(k.note)}</small></div>${k.action?`<button type="button" class="kpi-link" data-nav="${k.action}" aria-label="Examiner ${html(k.label)}"></button>`:''}</div>`).join('')}</div>
 <div class="exec-analytics"><section class="panel exec-panel chart-revenue"><div class="exec-panel-head"><h2>${ico('trend',18)} Évolution du chiffre d'affaires</h2><button data-nav="forecast" class="panel-menu" aria-label="Ouvrir les prévisions">${ico('arrow',18)}</button></div><div class="exec-chart">${lineChart(p.timeline,fc.ready?fc.future.slice(0,3):[],220)}</div><div class="exec-chart-caption">${fc.ready?'Historique HT observé et projection indicative':'Historique HT · projection non disponible'}</div></section>
 <section class="panel exec-panel chart-sector"><div class="exec-panel-head"><h2>${ico('chart',18)} CA par secteur client</h2><button data-nav="clients" class="panel-menu" aria-label="Voir les clients">${ico('arrow',18)}</button></div>${sectorBars(p.clients)}<div class="exec-chart-caption">Montants HT sur 12 mois · catégories déclarées</div></section>
 <section class="panel exec-panel chart-segment"><div class="exec-panel-head"><h2>${ico('users',18)} Segmentation client</h2><button data-nav="clients" class="panel-menu" aria-label="Explorer les clients">${ico('arrow',18)}</button></div>${donutOverview(segment,p.clients.length)}<div class="exec-chart-caption">Règles descriptives de récence, valeur et variation</div></section></div>
 <div class="exec-workspace"><section class="panel exec-panel exec-pipeline"><div class="exec-panel-head"><h2>${ico('layers',19)} Pipeline de suivi commercial</h2><button class="btn tiny" data-nav="tasks">Toutes les tâches ${ico('arrow',14)}</button></div>${overviewPipeline(tasks,recs)}</section>
 <section class="panel exec-panel exec-recommendations"><div class="exec-panel-head"><h2>${ico('spark',19)} Recommandations IA</h2><button data-nav="optim" class="panel-menu" aria-label="Voir recommandations">${ico('arrow',18)}</button></div><div class="recommendation-list">${state.source.kind==='audit'?`<div class="recommendation"><span class="rec-icon amber">${ico('warning',19)}</span><span><strong>Rapprocher les chiffres ERP</strong><small>Sources et devises à certifier avant priorisation.</small></span><button data-nav="quality" aria-label="Ouvrir la qualité">${ico('arrow',16)}</button></div><div class="recommendation"><span class="rec-icon blue">${ico('database',19)}</span><span><strong>Compléter les historiques</strong><small>Stock, clients, factures et coûts réels manquants.</small></span><button data-nav="data" aria-label="Importer les données">${ico('arrow',16)}</button></div>`:`<div class="recommendation"><span class="rec-icon amber">${ico('shield',19)}</span><span><strong>${fmt(risks??0)} compte${(risks??0)>1?'s':''} à risque élevé (simulation)</strong><small>Vérifier les signaux avant de contacter.</small></span><button data-nav="churn" aria-label="Voir les risques">${ico('arrow',16)}</button></div><div class="recommendation"><span class="rec-icon green">${ico('trend',19)}</span><span><strong>${fmt(recs.length)} actions proposées</strong><small>Évaluer les coûts et approuver un brouillon.</small></span><button data-nav="optim" aria-label="Voir les actions">${ico('arrow',16)}</button></div><div class="recommendation"><span class="rec-icon blue">${ico('box',19)}</span><span><strong>${fmt(inv.stockouts||0)} positions de stock à surveiller</strong><small>Vérifier seuils, réassort et capacité.</small></span><button data-nav="inventory" aria-label="Voir les stocks">${ico('arrow',16)}</button></div>`}</div><div class="recommendation-foot">${ico('shield',14)} Brouillons uniquement · validation humaine obligatoire</div></section></div>
 <div class="exec-bottom"><section class="panel exec-panel exec-priority"><div class="exec-panel-head"><h2>${ico('users',19)} Clients prioritaires · CA HT 12 mois</h2><button class="text-link" data-nav="clients">Voir tous ${ico('arrow',15)}</button></div>${table([{label:'Client',format:r=>`<button class="client-cell" data-client="${html(r.client)}">${ico('users',14)} <span>${html(r.nom||r.client)}</span></button>`},{label:'Profil',format:r=>{return `<span class="mini-tag">${r.recency==null||r.recency>90?'À examiner':r.delta>0?'En croissance':'Actif'}</span>`}},{label:'CA HT (12 mois)',num:true,format:r=>amt(r.amount)},{label:'Évolution',num:true,format:r=>`<span class="${r.delta>=0?'positive':'negative'}">${r.delta>=0?'+':''}${amt(r.delta)}</span>`},{label:'Suivi',format:r=>`<button class="btn tiny" data-client="${html(r.client)}">${ico('arrow',14)} Examiner</button>`}],clientsRank)}<div class="exec-table-foot">Classement par CA observé · ne constitue pas un score de potentiel</div></section>
 <section class="panel exec-panel exec-team"><div class="exec-panel-head"><h2>${ico('users',19)} Équipe & suivi des tâches</h2><button class="text-link" data-nav="tasks">Planning ${ico('arrow',15)}</button></div>${teamOverview(state.source,tasks)}<div class="exec-table-foot">Pour l’usage collaboratif réel, connecter l’API CRM et les permissions serveur.</div></section></div></div>`;
}

function clients(){const p=state.analysis.portfolio,all=p.clients||[],total=all.length,active=all.filter(c=>c.recency!=null&&c.recency<=90).length,idle=all.filter(c=>c.recency==null||c.recency>90).length,growth=all.filter(c=>c.delta>0).length,value=sum(all,c=>c.amount||0);const segments=segmentOverview(all);return `${heading('Clients 360°','Portefeuille, historique, segmentation et prochaines actions commerciales')}
 <div class="grid cards kpi-five">${metric('Comptes analysés',fmt(total),'Comptes du périmètre actif')}${metric('Actifs · 90 jours',fmt(active),total?pct(active/total)+' du portefeuille':'Aucun compte')}${metric('Montant HT · 12 mois',amtCompact(value),'Uniquement les pièces TND retenues')}${metric('À examiner',fmt(idle),'Récence supérieure à 90 jours ou inconnue')}${metric('CA en progression',fmt(growth),'Variation descriptive par compte')}</div>
 <div class="client-overview-grid"><section class="panel client-seg-panel"><div class="panel-head"><div class="panel-title-group"><span class="panel-title-icon">${ico('users',19)}</span><div><h2>Segmentation du portefeuille</h2><p>Classification descriptive · pas de probabilité prédictive</p></div></div></div>${donutOverview(segments,total)}</section><section class="panel client-trend-panel"><div class="panel-head"><div class="panel-title-group"><span class="panel-title-icon">${ico('trend',19)}</span><div><h2>Évolution des montants HT</h2><p>Historique mensuel disponible · TND</p></div></div></div>${lineChart(p.timeline.slice(-12),[],190)}</section></div>
 <section class="panel client-database"><div class="panel-head"><div class="panel-title-group"><span class="panel-title-icon">${ico('database',19)}</span><div><h2>Répertoire clients</h2><p>Recherche sur l’ensemble des ${fmt(total)} comptes · cliquer pour consulter l’historique</p></div></div><div class="panel-actions"><button class="btn tiny" data-action="exportClients">${ico('file',14)} Exporter CSV</button></div></div>
 <div class="filterbar client-filterbar"><label class="field-search">${ico('search',16)}<input class="input search" id="clientSearch" placeholder="Client, identifiant, activité…" value="${html(state.search)}"/></label><label class="filter-label">Profil <select class="select" id="clientSegment"><option value="">Tous les profils</option><option value="idle" ${state.segment==='idle'?'selected':''}>Inactifs (&gt; 90 j)</option><option value="strong" ${state.segment==='strong'?'selected':''}>Forte activité</option><option value="down" ${state.segment==='down'?'selected':''}>CA en baisse</option></select></label><span class="filter-hint">${ico('shield',14)} Données pseudonymisées / simulation selon source</span></div>
 <div id="client-table">${clientTable()}</div></section>
 ${notice('La marge dépend de la couverture des coûts. Les variations ne démontrent pas, à elles seules, une opportunité commerciale. Valider les relances avant attribution.',false)}`}

function clientRows(){const q=state.search.toLocaleLowerCase('fr').trim();let arr=state.analysis.portfolio.clients.filter(c=>(!q||c.client.toLowerCase().includes(q)||c.nom?.toLocaleLowerCase('fr').includes(q)||c.categorie?.toLowerCase().includes(q))&&(!state.segment||(state.segment==='idle'?(c.recency==null||c.recency>90):state.segment==='strong'?c.amount>25000:c.delta<0)));arr.sort((a,b)=>b.amount-a.amount||a.client.localeCompare(b.client));return arr}
function clientTable(){const all=clientRows();state.pageN=Math.min(Math.max(0,state.pageN),Math.max(0,Math.ceil(all.length/14)-1));const slice=all.slice(state.pageN*14,(state.pageN+1)*14);return `${table([{label:'Client',format:r=>`<button class="link" data-client="${html(r.client)}">${html(r.nom||r.client)}</button><br><span class="small muted">${html(r.client)}</span>`},{label:'Profil',format:r=>`<span class="segment-pill ${r.recency>90?'risk':r.delta>0?'growth':'core'}">${r.recency==null?'Inconnu':r.recency>90?'À examiner':r.delta>0?'Croissance':'Actif'}</span>`},{label:'Catégorie',format:r=>html(r.categorie||'—')},{label:'CA 12 mois',num:true,format:r=>amt(r.amount)},{label:'Marge renseignée',num:true,format:r=>amt(r.margin)},{label:'Dernier achat',format:r=>html(r.lastPurchase||'—')},{label:'Inactivité',num:true,format:r=>r.recency==null?'—':fmt(r.recency)+' j'},{label:'Commercial',format:r=>html(r.commercial||'Non affecté')},{label:'Action',format:r=>`<button class="btn tiny" data-client="${html(r.client)}">Examiner →</button>`}],slice,{footer:`${fmt(all.length)} clients après filtres · page ${state.pageN+1} / ${Math.max(1,Math.ceil(all.length/14))}`})}<div class="actions" style="margin-top:12px"><button class="btn tiny" data-action="prevClients" ${state.pageN===0?'disabled':''}>← Précédent</button><button class="btn tiny" data-action="nextClients" ${(state.pageN+1)*14>=all.length?'disabled':''}>Suivant →</button></div>`}
function drawer(cid){const c=state.analysis.portfolio.clientMap.get(cid);if(!c)return '';const logs=state.source.sales.filter(r=>r.client===cid&&r.devise==='TND');const months=[...group(logs,r=>r.date.slice(0,7))].sort((a,b)=>a[0].localeCompare(b[0])).slice(-18).map(([m,v])=>({m,ht:moneySum(v,'ht')}));const score=state.analysis.churn.scores?.find(x=>x.client===cid);const related=state.analysis.affinity.opportunities?.filter(r=>r.client===cid).slice(0,3)||[];
 return `<div class="backdrop" data-action="closeClient"></div><aside class="drawer"><div class="actions" style="justify-content:space-between"><span>${tag('Dossier client','audit')}</span><button class="btn tiny" data-action="closeClient">Fermer ×</button></div><h2 style="margin-top:19px">${html(c.nom||cid)}</h2><p class="muted">${html(cid)} · ${html(c.categorie||'Non classé')} · ${html(c.commercial||'Commercial non affecté')}</p><div class="drawer-section"><dl class="details"><dt>Montant HT 12 mois</dt><dd>${amt(c.amount)}</dd><dt>Marge disponible</dt><dd>${amt(c.margin)}</dd><dt>Pièces observées</dt><dd>${fmt(c.orders)}</dd><dt>Dernier achat</dt><dd>${html(c.lastPurchase||'—')}</dd><dt>Récence</dt><dd>${c.recency!=null?fmt(c.recency)+' jours':'—'}</dd><dt>Risque de désengagement</dt><dd>${score?.churnP!=null?pct(score.churnP):'Pas de probabilité validée'}</dd></dl></div>
 <div class="drawer-section"><h3>Évolution des achats</h3>${months.length>1?lineChart(months,[],170):'<p class="muted">Historique insuffisant</p>'}</div><div class="drawer-section"><h3>Opportunités à examiner</h3>${related.length?related.map(r=>`<p class="decision"><span class="body"><strong>${html(r.article)}</strong><small>${html(r.reason)}</small></span></p>`).join(''):'<p class="muted">Aucune recommandation de co-achat admissible.</p>'}</div>
 <div class="drawer-section"><h3>Pièces justificatives</h3>${table([{label:'Date',key:'date'},{label:'Pièce',format:r=>html(r.piece)},{label:'HT',num:true,format:r=>amt(r.ht)}],logs.slice(-8).reverse())}</div><div class="drawer-section"><button class="btn primary" data-action="proposeClient" data-cid="${html(cid)}" ${!c.commercial?'disabled':''}>Préparer une tâche commerciale</button><p class="chart-foot">Brouillon à approuver. Aucun appel, message ni création ERP automatique.</p></div></aside>`}
function churnPage(){const a=state.analysis,ch=a.churn;return `${heading('Risque de désengagement · 90 jours','Score explicable, validation temporelle, fiabilité par segment')}${!ch.ready?missing(ch.reason):`<div class="grid cards">${metric('Exemples entraînement',fmt(ch.trainN),'Snapshots antérieurs uniquement')}${metric('Échantillon test',fmt(ch.testN),'Coupes chronologiques réservées')}${metric('Precision@K',pct(ch.precisionAtK),`Top ${fmt(ch.K)} dans le test`)}${metric('Score de Brier',nr.format(ch.brier),'Plus faible = meilleur')}</div>${notice(ch.limit,true)}<div class="grid two equal">${panel('Calibration par niveau de risque','Comparer score moyen et fréquence observée',barRows(ch.bins.filter(x=>x.n>0).map(r=>({label:`Classe ${r.bin+1} · prévu ${pct(r.p)}`,value:r.observed})))+`<p class="chart-foot">Classes de 20 points de pourcentage · aucune probabilité produite sans historique.</p>`)}${panel('Comptes à examiner','Classement par risque, sous réserve de validation commerciale',churnTable(ch.scores))}</div>`}`}
function churnTable(rows){return table([{label:'Client',format:r=>`<button class="link" data-client="${html(r.client)}">${html(r.nom||r.client)}</button>`},{label:'Risque 90 j',num:true,format:r=>r.churnP==null?tag('Historique limité','warn'):pct(r.churnP)},{label:'Récence',num:true,format:r=>fmt(r.recency)+' j'},{label:'Montant 12 m',num:true,format:r=>amt(r.amount)}],rows.filter(r=>r.churnP!=null).slice(0,16))}
function affinityPage(){const a=state.analysis,af=a.affinity;return `${heading('Affinités & recommandations produits','Identifier les produits complémentaires, avec stock et justificatif statistique')}${!af.ready?missing(af.reason):`<div class="grid cards">${metric('Paniers examinés',fmt(af.baskets),'Sur les 12 derniers mois')}${metric('Règles de co-achat',fmt(af.rules.length),'Support ≥ 10 paniers')}${metric('Pistes commerciales',fmt(af.opportunities.length),'Sélection des meilleures recommandations')}${metric('Validation modèle','À réaliser','Precision@K hors entraînement')}</div>${notice('Un co-achat fréquent ne prouve pas qu’une recommandation provoquera un achat. Vérifier marge, stock et compatibilité avant tout devis.',true)}${panel('Associations de produits','Lift supérieur à 1 : co-achat plus fréquent que prévu par la fréquence indépendante',table([{label:'Produit acheté',key:'anchor'},{label:'Proposition',key:'target'},{label:'Paniers',num:true,format:r=>fmt(r.support)},{label:'Confiance',num:true,format:r=>pct(r.confidence)},{label:'Lift',num:true,format:r=>nr.format(r.lift)}],af.rules.slice(0,15)))}${panel('Clients et opportunités','Pas d’envoi automatique de proposition',table([{label:'Client',format:r=>`<button class="link" data-client="${html(r.client)}">${html(r.client)}</button>`},{label:'Produit',key:'article'},{label:'Motif',key:'reason'},{label:'Lift',num:true,format:r=>nr.format(r.lift)},{label:'Commercial',key:'commercial'}],af.opportunities.slice(0,35)),`<button class="btn tiny" data-action="exportAffinity">Exporter CSV</button>`)}`}`}
function forecastPage(){const a=state.analysis,fc=a.forecast,p=a.portfolio;return `${heading('Prévision du chiffre d’affaires & de la demande','Modèles comparés en validation chronologique et incertitude affichée')}<div class="filterbar"><label>Horizon <select class="select" id="forecastHorizon">${[1,3,6,12].map(x=>`<option value="${x}" ${state.horizon===x?'selected':''}>${x} mois</option>`).join('')}</select></label><button class="btn" data-action="exportForecast">Exporter prévisions</button></div>${!fc.ready?missing(fc.reason):`<div class="grid cards">${metric('Prévision du prochain mois',amt(fc.future[0].pred),'Montant HT estimé · TND')}${metric('Cumul · horizon',amt(sum(fc.future,r=>r.pred)),`${state.horizon} mois à partir de ${fc.future[0].m}`)}${metric('Méthode retenue',html(fc.selected.name),'Plus faible MAE sur validation')}${metric('WAPE hors entraînement',pct(fc.selected.wape),`${fc.selected.tests} mois testés`)}</div>${notice(fc.interval,true)}${panel('Historique et projection','Réel observé vs scénario statistique · la bande n’est pas un intervalle prédictif calibré',lineChart(p.timeline,fc.future)+sourceFoot('Calcul as-of '+fc.trainedThrough))}${panel('Méthodes concurrentes & erreurs','MAE, WAPE, biais ; seuils de promotion non validés',table([{label:'Méthode',key:'name'},{label:'Périodes testées',num:true,format:r=>fmt(r.tests)},{label:'MAE',num:true,format:r=>amt(r.mae)},{label:'WAPE',num:true,format:r=>pct(r.wape)},{label:'Biais',num:true,format:r=>pct(r.bias)},{label:'Statut',format:r=>r.name===fc.selected.name?tag('Référence choisie','good'):tag('Alternative')}],fc.candidates))}${panel('Projection mensuelle','Horizon par mois, montant HT sans TVA ni conversion de devise',table([{label:'Mois',key:'m'},{label:'Prévision',num:true,format:r=>amt(r.pred)},{label:'Borne basse indicative',num:true,format:r=>amt(r.lo)},{label:'Borne haute indicative',num:true,format:r=>amt(r.hi)}],fc.future))}${a.demand.ready?panel('Prévision de demande par article et dépôt','Horizon 1 mois · saisonnier, moyenne trois mois, Croston-SBA',table([{label:'Article',key:'article'},{label:'Dépôt',key:'depot'},{label:'Qté attendue',num:true,format:r=>nr.format(r.monthly)},{label:'Méthode',key:'method'},{label:'WAPE test',num:true,format:r=>pct(r.wape)},{label:'Mois à 0',num:true,format:r=>fmt(r.zeroMonths)}],a.demand.rows.slice(0,25))):''}`}`}
function inventoryPage(){const x=state.analysis.inventory;return `${heading('Stocks, ruptures et réapprovisionnement','Disponibilité, réservations, délai fournisseur, MOQ et alternatives multi-dépôts')}${!x.ready?missing(x.reason):`<div class="grid cards">${metric('Positions suivies',fmt(x.plans.length),'Produit × dépôt')}${metric('Ruptures potentielles',fmt(x.stockouts),'Couverture inférieure au délai')}${metric('Coût indicatif commandes',amt(x.cost),'Coût unitaire de référence')}${metric('Décisions','À approuver','Aucune écriture ERP')}</div>${panel('Plan de couverture du stock','Demande moyenne récente · vérifier demande censurée en rupture',table([{label:'Article',key:'article'},{label:'Dépôt',key:'depot'},{label:'Stock disponible',num:true,format:r=>fmt(r.available)},{label:'Couverture',num:true,format:r=>r.coverage==null?'—':`${fmt(r.coverage)} j`},{label:'Lead time',num:true,format:r=>`${fmt(r.lead)} j`},{label:'Besoin',num:true,format:r=>fmt(r.order)},{label:'Alternative',format:r=>html(r.alternative||r.decision)},{label:'Statut',format:r=>r.stockout?tag('Risque','bad'):badgeStatus(r.decision)}],x.plans),`<button class="btn tiny" data-action="exportInventory">Exporter plan</button>`)}`}`}

 <section class="panel task-priority"><div class="panel-head"><div class="panel-title-group"><span class="panel-title-icon">${ico('clock',19)}</span><div><h2>Actions prioritaires</h2><p>Échéances et responsabilités</p></div></div></div>${own.filter(x=>x.status!=='terminée').sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,6).map(x=>`<div class="priority-item"><span class="priority-indicator">${ico('calendar',16)}</span><div><strong>${html(x.title)}</strong><small>${html(x.client||'Sans client')} · ${html(x.owner||'À attribuer')}</small></div><span class="due-chip">${html(x.due||'—')}</span></div>`).join('')||`<div class="no-priority">${ico('check',25)}<strong>Aucune action en attente</strong><p>Les recommandations commerciales peuvent générer un brouillon, à approuver avant suivi.</p><button class="btn primary" data-nav="optim">Examiner les opportunités</button></div>`}<div class="task-privacy">${ico('shield',16)} Tâches locales · aucun envoi automatique ni synchronisation CRM.</div></section></div>
 <section class="panel task-registry"><div class="panel-head"><div class="panel-title-group"><span class="panel-title-icon">${ico('check',19)}</span><div><h2>Registre des décisions</h2><p>Traçabilité des validations et des changements d’état</p></div></div><button class="btn tiny" data-action="exportTasks">${ico('file',14)} Exporter CSV</button></div><div class="filterbar"><label>Afficher <select class="select" id="taskView">${[['all','Toutes'],['brouillon','À valider'],['approuvée','Approuvées'],['en cours','En cours'],['terminée','Terminées']].map(([v,t])=>`<option value="${v}" ${state.taskView===v?'selected':''}>${t}</option>`).join('')}</select></label><span class="filter-hint">${fmt(tableRows.length)} action(s) affichée(s)</span></div>${table([{label:'ID',format:r=>html(r.id)},{label:'Client',format:r=>`<button class="link" data-client="${html(r.client)}">${html(r.client)}</button>`},{label:'Objet',format:r=>html(r.title)},{label:'Responsable',format:r=>html(r.owner||'À attribuer')},{label:'Échéance',format:r=>html(r.due)},{label:'Statut',format:r=>badgeStatus(r.status)},{label:'Action',format:r=>r.status==='brouillon'?`<button class="btn tiny primary" data-task="${html(r.id)}" data-tcmd="approve">Approuver</button>`:r.status==='approuvée'?`<button class="btn tiny" data-task="${html(r.id)}" data-tcmd="start">Démarrer</button>`:r.status==='en cours'?`<button class="btn tiny" data-task="${html(r.id)}" data-tcmd="done">Terminer</button>`:'—'}],tableRows.slice(-80).reverse())}</section>

function assistantReply(q){const a=state.analysis,p=a.portfolio,fc=a.forecast,ch=a.churn,af=a.affinity,s=state.source;const foot=`\n\nSource : ${s.name}, arrêté ${s.asOf}. ${label()}.`;
 q=q.toLocaleLowerCase('fr').trim();if(!q)return 'Pose une question sur le CA, clients, risques, produits, stock ou production.';
 if(/prévoi|forecast|mois prochain|prochain mois|chiffre.*futur/.test(q))return fc.ready?`Prévision HT du prochain mois (${fc.future[0].m}) : ${amt(fc.future[0].pred)}. Référence sélectionnée : ${fc.selected.name}, WAPE de validation ${pct(fc.selected.wape)} ; plage indicative ${amt(fc.future[0].lo)}–${amt(fc.future[0].hi)}. La bande reste empirique.`+foot:'Je ne peux pas estimer ce mois : '+fc.reason+foot;
 if(/client|relanc|commercial|contact|inactif|churn/.test(q)){const rows=ch.scores?.filter(x=>x.recency>60&&x.amount>0).slice(0,5)||[];return rows.length?`Comptes à examiner : ${rows.map(x=>`${x.client} (${x.recency} j depuis achat${x.churnP==null?'':`, score ${pct(x.churnP)}`})`).join(' ; ')}. Une tâche ne sera créée qu’après approbation.`+foot:'La source ne permet pas de recommander de relance client sans contexte suffisant.'+foot;}
 if(/pourquoi|baisse|diminu|revenue|revenu|ca |chiffre|ventes/.test(q)){const t=p.timeline;if(t.length<2)return 'Périodes comparables indisponibles.'+foot;const c=t.at(-1),b=t.at(-2);return `Montant HT ${c.m} : ${amt(c.ht)} contre ${amt(b.ht)} en ${b.m} (${b.ht?pct((c.ht-b.ht)/b.ht):'référence nulle'}). Ceci décrit une variation, pas ses causes. Vérifier volume, mix, retours, couverture et devise avant d'attribuer une cause.`+foot;}
 if(/produit|cross.sell|upsell|opportun/.test(q))return af.ready?`Top suggestion statistique : ${af.rules[0].anchor} → ${af.rules[0].target}, lift ${nr.format(af.rules[0].lift)}, support ${af.rules[0].support} paniers. Vérifier stock, marge et compatibilité avant tout contact.`+foot:'Les lignes article × panier manquent. Impossible d’établir des co-achats.'+foot;
 if(/stock|rupture|réassort/.test(q))return a.inventory.ready?`${a.inventory.stockouts} positions affichent une couverture inférieure au délai de livraison. Coût de réassort simulé : ${amt(a.inventory.cost)}. Vérifier commandes, stock en transit et réservations auprès de l’ERP.`+foot:'Historique de stock insuffisant pour calculer les ruptures.'+foot;
 if(/fabric|production|usine|machine/.test(q))return a.prod.ready?`Scénario central : ${fmt(a.prod.totalUnits)} unités réalisables, ${fmt(a.prod.uncovered)} non couvertes. Le plan dépend des capacités et nomenclatures importées.`+foot:'Production non calculable : nomenclatures, capacités et matières manquantes.'+foot;
 if(/encaissement|trésorerie|paiement|facture/.test(q))return a.cash.ready?`Créances TND : ${amt(a.cash.total)}, encaissements attendus indicatifs à 90 jours : ${amt(a.cash.expected90)}. Flux sortants et positions bancaires non intégrés.`+foot:'Données de paiements et échéances manquantes.'+foot;
 return `Je peux analyser les données accessibles sur : CA, clients à relancer, prévision mensuelle, produits complémentaires, stock, trésorerie et production. Reformule ta question avec l'un de ces sujets.`+foot;}

function exportCSV(name,rows){if(!rows?.length){toast('Aucune ligne à exporter');return}const keys=Object.keys(rows[0]);const content='\ufeff'+keys.map(safeCSV).join(';')+'\r\n'+rows.map(r=>keys.map(k=>safeCSV(r[k]??'')).join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download=name+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportJSON(name,object){const url=URL.createObjectURL(new Blob([JSON.stringify(object,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}

constraints'},{label:'Action',format:r=>`<button class="btn tiny" data-prod-propose="${html(r.article)}" data-depot="${html(r.depot)}">Créer tâche</button>`}],rows.filter(r=>r.missing>0).slice(0,12)),{icon:'warning'})}`);
}
function firstCash(){const c=state.analysis.cash;if(!c.ready)return fAll('Trésorerie & retards','Recouvrement, échéances et cash-in',fKpis([{icon:'wallet',label:'Créances',value:'—'}]),fUnavailable(c.reason));const b=c.buckets;const names={nonEchu:'Non échues',one30:'1–30 jours',one60:'31–60 jours',plus60:'Plus de 60 jours'};return fAll('Trésorerie & retards','Créances, projection et priorités de recouvrement',fKpis([{icon:'wallet',label:'Créances ouvertes',value:fMoney(c.total)},{icon:'trend',label:'Cash-in estimé · 90 jours',value:fMoney(c.expected90),note:'Hors flux sortants'},{icon:'clock',label:'Règlements historiques',value:fmt(c.paidHistory)},{icon:'warning',label:'Litiges ouverts',value:fmt(c.disputes)}]),`<div class="f-grid f-halves">${fCard('Répartition des échéances',donutOverview(b.map((r,i)=>({name:names[r.bucket]||r.bucket,n:r.amount,color:['#0a58ec','#4d98ff','#e9b34d','#e35663'][i]})),c.total),{icon:'wallet'})}${fCard('Âges des créances',fProgress(b.map(r=>({name:names[r.bucket]||r.bucket,v:100*r.amount/Math.max(1,c.total),value:fMoney(r.amount)})))+`<p class="f-note">Répartition comptable des factures : pas de solde bancaire en temps réel.</p>`,{icon:'clock'})}</div>${fCard('Plan de relance · interprétation',fTopRows([{t:'Suivre les créances > 60 jours',d:'Priorité au rapprochement des soldes et litiges'},{t:'Vérifier les paiements partiels',d:'Éviter les doubles relances'},{t:'Valider les échéances',d:'Ne jamais envoyer une relance automatique sans autorisation'}],r=>`<div class="f-activity"><span>${ico('wallet',16)}</span><div><strong>${html(r.t)}</strong><small>${html(r.d)}</small></div></div>`),{icon:'check'})}`);
}
function firstOptim(){const x=optimizeActions(state.analysis.churn,state.analysis.affinity,state.source,state.budget);return fAll('Scénarios & optimisation','Arbitrer un budget et proposer des actions validables',fKpis([{icon:'wallet',label:'Budget du scénario',value:amt(state.budget)},{icon:'check',label:'Actions proposées',value:x.ready?fmt(x.selected.length):'—'},{icon:'wallet',label:'Coût modélisé',value:x.ready?amt(x.totalCost):'—'},{icon:'spark',label:'Potentiel théorique',value:x.ready?amt(x.estimated):'—',note:'Non causal, non garanti'}]),`<div class="f-filterline"><label>Budget TND : <input class="input" id="optimBudget" type="number" min="0" max="100000" step="250" value="${state.budget}"/></label><button class="btn primary tiny" data-action="refreshOptim">Recalculer le scénario</button></div>${x.ready?`<div class="f-grid f-halves">${fCard('Opportunités retenues',table([{label:'Client',format:r=>`<button class="link" data-client="${html(r.client)}">${html(r.client)}</button>`},{label:'Action',key:'action'},{label:'Coût',num:true,format:r=>amt(r.cost)},{label:'Décision',format:r=>`<button class="btn tiny" data-propose="${html(r.id)}">Proposer</button>`}],x.selected.slice(0,12)),{icon:'target'})}${fCard('Hypothèses & limites',fStrip([['Enveloppe',amt(x.budget)],['Actions',fmt(x.selected.length)],['Coût',amt(x.totalCost)]])+`<p class="f-note">Les gains prévus sont des opportunités heuristiques, pas un ROI mesuré ni une optimisation globale de l’entreprise.</p>`,{icon:'sliders'})}</div>`:fUnavailable(x.reason)}`);
}
function firstQuality(){const q=state.analysis.quality,rows=state.analysis.anomalies||[];return fAll('Qualité & anomalies','Fiabilité des données et contrôles avant décision',fKpis([{icon:'database',label:'Pièces distinctes',value:fmt(q.uniqueDocs)},{icon:'users',label:'Clients présents',value:fmt(q.clients)},{icon:'warning',label:'Doublons',value:fmt(q.dupes),tone:'red'},{icon:'box',label:'Coûts non renseignés',value:fmt(q.unknownCost),note:'Marge à qualifier'}]),`<div class="f-grid f-halves">${fCard('Qualité par contrôle',fProgress([{name:'Structure des lignes',v:q.ok?100:60,value:q.ok?'Conforme':'Anomalies'},{name:'Identifiants uniques',v:q.rows?100*(1-q.dupes/q.rows):0,value:`${fmt(q.dupes)} doublons`},{name:'Coûts disponibles',v:q.rows?100*(1-q.unknownCost/q.rows):0,value:`${fmt(q.unknownCost)} absents`},{name:'Périodes observées',v:Math.min(100,q.days/365*100),value:`${fmt(q.days)} jours`}]),{icon:'shield'})}${fCard('Écarts à traiter',fTopRows((q.issues||[]).slice(0,6).map(r=>({label:typeof r==='string'?r:JSON.stringify(r)})),r=>`<div class="f-activity"><span>${ico('warning',16)}</span><div><strong>${html(r.label)}</strong></div></div>`)+`<p class="f-note">Sur l’extrait SQL, rapprochement obligatoire avec le Journal ERP et vigilance sur octobre incomplet.</p>`,{icon:'warning'})}</div>${fCard('Anomalies identifiées',rows.length?table([{label:'Type',format:r=>html(r.type||r.kind||r.reason||'Contrôle')},{label:'Justificatif',format:r=>html(r.message||r.detail||r.client||'—')}],rows.slice(0,14)):'<p class="f-none">Aucune anomalie détectée par les règles disponibles sur le jeu actif. Cela ne signifie pas une certification ERP.</p>',{icon:'database',action:'<button class="btn tiny" data-action="exportAnomalies">Exporter CSV</button>'})}`);
}
function firstImpact(){
 const i=state.analysis.impact;
 if(!i.ready)return fAll('Impact des actions','Mesurer les effets des interventions',fKpis([{icon:'trend',label:'Mesure d’impact',value:'—'}]),fUnavailable(i.reason));
 const kpis=fKpis([
  {icon:'users',label:'Comptes avec intervention',value:fmt(i.actionN)},
  {icon:'users',label:'Comptes témoins',value:fmt(i.controlN)},
  {icon:'trend',label:'Écart descriptif moyen',value:amt(i.difference),note:'Non causal'},
  {icon:'wallet',label:'Résultat descriptif net',value:amt(i.net),note:'Après coûts déclarés'}
 ]);
 const data=state.source.interventions||[];
 const comparators=[['action','Intervention'],['control','Groupe témoin']].map(([groupKey,name])=>{
  const rows=data.filter(r=>r.group===groupKey);
  return {name,n:rows.length,before:rows.length?sum(rows,r=>r.before)/rows.length:0,after:rows.length?sum(rows,r=>r.after)/rows.length:0,delta:rows.length?sum(rows,r=>r.after-r.before)/rows.length:0};
 });
 const compare=table([{label:'Groupe',key:'name'},{label:'Comptes',num:true,format:r=>fmt(r.n)},{label:'Moyenne avant',num:true,format:r=>amt(r.before)},{label:'Moyenne après',num:true,format:r=>amt(r.after)},{label:'Variation moyenne',num:true,format:r=>amt(r.delta)}],comparators);
 const methods=`<div class="f-impact-text"><b>Méthode de mesure</b><p>${html(i.method)}</p></div>${fStrip([['Coût observé',amt(i.cost)],['Écart brut descriptif',amt(i.difference)],['Net descriptif',amt(i.net)]])}${fWarning('Sans randomisation et vérification des groupes, l’écart ne démontre pas un uplift causal.')}`;
 const followup=table([{label:'Compte',format:r=>`<button class="link" data-client="${html(r.client)}">${html(r.client)}</button>`},{label:'Groupe',format:r=>fMark(r.group==='action'?'Action':'Témoin',r.group==='action'?'blue':'green')},{label:'Avant',num:true,format:r=>amt(r.before)},{label:'Après',num:true,format:r=>amt(r.after)},{label:'Écart',num:true,format:r=>amt(r.after-r.before)}],data.slice(0,12));
 const body=`<div class="f-grid f-halves">${fCard('Comparaison action / témoin',compare,{icon:'chart'})}${fCard('Interprétation & limites',methods,{icon:'shield'})}</div><div class="f-grid f-halves">${fCard('Variations observées',barRows(comparators.map(r=>({label:r.name,value:Math.max(0,r.delta)})))+'<p class="f-note">Variations moyennes, sans attribution causale.</p>',{icon:'trend'})}${fCard('Périmètre de l’évaluation',fStrip([['Source',fSource()],['Comptes traités',fmt(i.actionN)],['Témoins',fmt(i.controlN)]])+fWarning('Nécessite des dates d’intervention, coûts complets et contrôle des biais avant certification.'),{icon:'database'})}</div>${fCard('Détails des observations (échantillon)',followup,{icon:'users'})}`;
 return fAll('Impact des actions','Avant / après, témoins, résultats et coûts des interventions',kpis,body);
}
function firstModels(){
 const a=state.analysis;
 const ready=a.registry.filter(r=>/disponible|test|règle|calcul/i.test(r.state)).length;
 const kpis=fKpis([
  {icon:'database',label:'Domaines DS suivis',value:fmt(a.registry.length)},
  {icon:'target',label:'Modules calculables en pilote',value:fmt(ready)},
  {icon:'trend',label:'PSI des montants HT',value:a.drift.ready?psiFmt(a.drift.psi):'—',note:'Dérive des données'},
  {icon:'warning',label:'Alertes de dérive',value:a.drift.ready?(a.drift.alert?'1':'0'):'—',tone:a.drift.alert?'red':''},
  {icon:'shield',label:'Modèles homologués LAI',value:'0',note:'Certification non réalisée'}
 ]);
 const registry=table([{label:'ID',key:'id'},{label:'Usage',key:'name'},{label:'Version',key:'version'},{label:'État pilote',format:r=>badgeStatus(r.state)}],a.registry);
 const drift=a.drift.ready?fStrip([['PSI',psiFmt(a.drift.psi)],['Référence',html(a.drift.reference)],['Fenêtre',html(a.drift.current)]])+fProgress([{name:'PSI / seuil de vigilance 0,2',v:Math.min(100,a.drift.psi/.2*100),value:psiFmt(a.drift.psi)}])+`<p class="f-note">${html(a.drift.note)}</p>`:fUnavailable(a.drift.reason);
 const bands=a.drift.ready?table([{label:'Montant HT',key:'range'},{label:'Référence',num:true,format:r=>pct(r.reference)},{label:'Fenêtre courante',num:true,format:r=>pct(r.current)},{label:'Écart',num:true,format:r=>pct(r.current-r.reference)}],a.drift.detail):fUnavailable(a.drift.reason);
 const evaluations=[
  {label:'Backtest prévision chronologique',done:a.forecast.ready,note:a.forecast.ready?`WAPE ${pct(a.forecast.selected.wape)} · ${a.forecast.selected.name}`:'À calculer'},
  {label:'Validation churn hors entraînement',done:a.churn.ready,note:a.churn.ready?`Brier ${nr.format(a.churn.brier)} · top K ${fmt(a.churn.K)}`:'Historique insuffisant'},
  {label:'Surveillance de dérive',done:a.drift.ready,note:a.drift.ready?`PSI ${psiFmt(a.drift.psi)} · montants de pièces`:'Référence absente'},
  {label:'Rapprochement au Journal ERP',done:false,note:'Contrôle officiel LAI manquant'},
  {label:'Mise en production et réentraînement',done:false,note:'Pipeline d’orchestration non déployé'}
 ];
 const monitoring=fTopRows(evaluations,r=>`<div class="f-activity"><span>${ico(r.done?'check':'warning',16)}</span><div><strong>${html(r.label)}</strong><small>${html(r.note)}</small></div>${fMark(r.done?'Pilote':'À faire',r.done?'green':'amber')}</div>`);
 const body=`<div class="f-grid f-halves">${fCard('Registre Data Science · DS-01 à DS-11',registry,{icon:'database',action:'<button class="btn tiny" data-action="exportManifest">Exporter registre</button>'})}${fCard('Surveillance & dérive',drift,{icon:'trend'})}</div><div class="f-grid f-halves">${fCard('Distribution de référence / période',bands,{icon:'chart'})}${fCard('Tests, alertes et déploiement',monitoring,{icon:'shield'})}</div>${fWarning('Les scores de démonstration ne sont pas des modèles IA certifiés en production. Aucun réentraînement automatique n’est exécuté.')}`;
 return fAll('Modèles & MLOps','Registre, backtests, dérive et conditions de déploiement',kpis,body);
}
function firstAssistant(){const a=state.analysis,p=a.portfolio;return fAll('Assistant de direction','Questions métier, analyses sourcées et recommandations à valider',fKpis([{icon:'users',label:'Portefeuille analysé',value:fmt(p.clients.length)},{icon:'database',label:'Jeu de données actif',value:fSource()},{icon:'check',label:'Type d’assistant',value:'Analytique local'},{icon:'shield',label:'Actions automatiques',value:'Désactivées'}]),`<div class="f-grid f-chat-grid">${fCard('Votre assistant métier',`<div class="f-chat"><p class="f-bubble f-bot">Bonjour. Je peux résumer les chiffres du jeu actif, proposer des comptes à examiner et expliquer les limites des prévisions.</p>${state.assistant?`<p class="f-bubble f-answer">${html(state.assistant).replace(/\n/g,'<br>')}</p>`:''}</div><div class="chat-input"><input class="input" id="assistantQuestion" placeholder="Ex. Quelle prévision pour le mois prochain ?"/><button class="btn primary" data-action="ask">Analyser ${ico('arrow',15)}</button></div>`,{icon:'spark'})}<div class="f-side-stack">${fCard('Questions suggérées',fTopRows(['Prévois le chiffre d’affaires du mois prochain','Quels clients contacter ?','Quels produits recommander ?','Où sont les risques de rupture ?','Que produire le mois prochain ?'],q=>`<button class="f-question" data-question="${html(q)}">${ico('spark',14)} ${html(q)}</button>`),{icon:'help'})}${fCard('Priorités proposées',fActionsQueue(3),{icon:'target'})}</div></div>`);

function firstData(){
 const a=state.analysis,s=state.source;
 const kpis=fKpis([
  {icon:'database',label:'Source active',value:s.kind==='demo'?'Simulation':s.kind==='audit'?'Extrait SQL':'Import local'},
  {icon:'clock',label:'Date d’arrêté',value:html(s.asOf)},
  {icon:'file',label:'Lignes de ventes',value:fmt(a.quality.rows)},
  {icon:'shield',label:'Rapprochement ERP',value:'Non validé'},
  {icon:'warning',label:'Doublons détectés',value:fmt(a.quality.dupes),tone:a.quality.dupes?'red':''}
 ]);
 const sources=[['Clients','clients'],['Ventes','sales'],['Factures','invoices'],['Stocks','stocks'],['Fournisseurs','purchaseOrders'],['Catalogue','catalog'],['Nomenclatures','bom'],['Matières','materials'],['Capacités','capacity'],['Interventions','interventions']].map(([label,key])=>({label,key,n:(s[key]||[]).length}));
 const sourceTable=table([{label:'Domaine',key:'label'},{label:'Enregistrements',num:true,format:r=>fmt(r.n)},{label:'État',format:r=>r.n>0?fMark(s.kind==='demo'?'Exemple simulé':'Extrait local','green'):fMark('À importer','amber')}],sources);
 const freshness=fStrip([['Couverture temporelle',fmt(a.quality.days)+' jours'],['Pièces uniques',fmt(a.quality.uniqueDocs)],['Clients référencés',fmt(a.quality.clients)]])+fProgress([{name:'Identifiants de pièces uniques',v:a.quality.rows?100*(1-a.quality.dupes/a.quality.rows):0,value:fmt(a.quality.dupes)+' doublons'},{name:'Coûts présents',v:a.quality.rows?100*(1-a.quality.unknownCost/a.quality.rows):0,value:fmt(a.quality.unknownCost)+' absents'}]);
 const action=`<div class="f-source-choice"><div><strong>Extrait SQL pseudonymisé</strong><small>Janvier–octobre 2026 · rapprochement ERP requis</small><button class="btn tiny" data-action="switchAudit">Ouvrir SQL</button></div><div><strong>Simulation 10 000 clients</strong><small>46 mois · clients, finance, production · données fictives</small><button class="btn tiny primary" data-action="switchDemo">Ouvrir démo</button></div></div>`;
 const importInfo=`<p class="f-overview-text">Les connecteurs et synchronisations SAP / CRM ne sont pas branchés. Le pilote importe des CSV en mémoire, sans transfert externe. Les vérifications de dates, devises et doublons sont appliquées avant l’analyse.</p><button class="btn primary" data-action="openAdvanced">Importer des fichiers CSV ${ico('arrow',15)}</button>`;
 const body=`<div class="f-grid f-halves">${fCard('Catalogue de données du jeu actif',sourceTable,{icon:'database'})}${fCard('Fraîcheur & contrôle',freshness,{icon:'shield'})}</div><div class="f-grid f-halves">${fCard('Sélectionner un jeu',action,{icon:'layers'})}${fCard('Importer et raccorder LAI',importInfo,{icon:'file'})}</div>`;
 return fAll('Sources de données','Périmètre, fichiers, validité et traçabilité des calculs',kpis,body);
}
const FIRST_DESIGN_PAGES={home:firstHome,clients:firstClients,tasks:firstTasks,churn:firstChurn,affinity:firstAffinity,forecast:firstForecast,inventory:firstInventory,suppliers:firstSuppliers,production:firstProduction,cash:firstCash,optim:firstOptim,quality:firstQuality,impact:firstImpact,models:firstModels,assistant:firstAssistant,data:firstData};
