services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_negoce
      POSTGRES_USER: ai_negoce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_negoce -d ai_negoce"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      NODE_ENV: production
      AUTH_MODE: oidc
      HOST: 0.0.0.0
      API_PORT: 3001
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN}
      DATABASE_URL: postgresql://ai_negoce:${POSTGRES_PASSWORD}@postgres:5432/ai_negoce
      OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?set OIDC_AUDIENCE}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:?set OIDC_JWKS_URL}
      ERP_BASE_URL: ${ERP_BASE_URL:?set ERP_BASE_URL}
      ERP_API_TOKEN: ${ERP_API_TOKEN:?set ERP_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["3001:3001"]
    read_only: true
    tmpfs: ["/tmp"]
    volumes: ["uploads:/app/var/uploads"]
volumes:
  postgres_data:
  uploads:
