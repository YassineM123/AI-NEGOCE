name: quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - name: Check client demo BI JavaScript syntax
        run: node --check dashboards/data-analysis/app.js
      - run: npm run dataset:generate
      - run: npm run db:seed
      - name: Audit generated ERP foreign-key histories and stock reconciliation
        run: npm run qa:linked-data
      - name: Validate pseudonymized Phase 2 Database extractions
        run: npm run demo:database:audit
      # GitHub stores OCR fixture binaries in LFS. A normal checkout only returns
      # tiny pointers, which must NEVER be treated as uploadable PDF/image bytes.
      - name: Materialize adverse OCR/upload fixture binaries
        run: |
          git lfs install --local
          git lfs pull --include="fixtures/adverse/ocr/**,fixtures/adverse/upload/**" --exclude=""
      - name: Verify real fixture signatures and reject LFS pointers
        run: node scripts/check-qa-fixtures.mjs
      - run: npm test
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e -- --project=desktop
      - run: npm run build
      - run: npm run check:bundle
      - run: npm audit --audit-level=high
      - run: docker build -t ai-negoce:${{ github.sha }} .
